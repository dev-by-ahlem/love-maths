<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Maths</title>
    <!--FontAwesome link:-->
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
    <!--Google Fonts link:-->
<link href="https://fonts.googleapis.com/css?family=Raleway%7CRighteous" rel="stylesheet">   
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <h1 class="heading"><img class= "logo" src="assets/images/logo.png" alt="logo">Love Maths</h1>
  <div class="game-area"> 
    <!-- Main container that holds the entire game interface -->

    <div class="controls-area">
        <!-- Section containing the operation buttons (+, -, ×, ÷) -->

        <button class="btn btn--big btn--green">
            <i class="fas fa-plus"></i>
        </button>
        <!-- Button for addition -->

        <button class="btn btn--big btn--blue">
            <i class="fas fa-minus"></i>
        </button>
        <!-- Button for subtraction -->

        <button class="btn btn--big btn--orange">
            <i class="fas fa-times"></i>
        </button>
        <!-- Button for multiplication -->

        <button class="btn btn--big btn--red">
            <i class="fas fa-divide"></i>
        </button>
        <!-- Button for division -->
    </div>

    <div class="question-area">
        <!-- Section that displays the math question and answer input -->

        <span id="operand1">0</span>
        <!-- First number in the equation -->

        <span id="operator">x</span>
        <!-- Operator symbol (+, -, ×, ÷) -->

        <span id="operand2">0</span>
        <!-- Second number in the equation -->

        <span>=</span>
        <!-- Equal sign -->

        <p class="answer-message">Enter Answer:</p>
        <!-- Instruction text for the user -->

        <input id="answer-box" type="number">
        <!-- Input field where the user types their answer -->
    </div>

    <button class="btn btn--gray">Submit Answer</button>
    <!-- Button to submit the user's answer -->
</div>

<div class="score-area">
    <!-- Section that displays the score results -->

    <p class="scores">Correct Answers <span id="score">0</span></p>
    <!-- Shows number of correct answers -->

    <p class="scores">Incorrect Answers <span id="incorrect">0</span></p>
    <!-- Shows number of incorrect answers -->
</div>


 <script src="assets/js/script.js"></script>   
</body>
</html>
